<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barça Hub</title>
  <style>
    :root {
      --bg: #0B0E14;
      --card: #161B22;
      --accent: #A50044;
      --yellow: #EDBB00;
      --text: #F0F6FC;
      --subtext: #8B949E;
      --green: #238636;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      background: var(--card);
      border: 1px solid #30363D;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #21262D;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(35, 134, 54, 0.15);
      color: #3FB950;
      border: 1px solid rgba(63, 185, 80, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #3FB950;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(63, 185, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
    }
    .time-text {
      font-size: 0.8rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; font-size: 1.4rem;">🔵🔴 Barça Hub</h1>
    <div id="clock-display" style="font-size: 1.1rem; font-weight: bold; color: var(--yellow); margin-top: 6px;"></div>
    
    <div class="status-bar">
      <div class="badge">
        <span class="pulse-dot"></span>
        <span id="sync-status">LIVE SYNC</span>
      </div>
      <div class="time-text" id="time-ago">Updated just now</div>
    </div>
  </div>

  <script>
    let lastFetchTime = new Date();

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('clock-display').innerText = now.toLocaleString([], options);

      // Calculate elapsed seconds since last data load
      const elapsedSeconds = Math.floor((now - lastFetchTime) / 1000);
      const timeAgoEl = document.getElementById('time-ago');
      
      if (elapsedSeconds < 10) {
        timeAgoEl.innerText = 'Updated just now';
      } else if (elapsedSeconds < 60) {
        timeAgoEl.innerText = `Updated ${elapsedSeconds}s ago`;
      } else {
        const mins = Math.floor(elapsedSeconds / 60);
        timeAgoEl.innerText = `Updated ${mins}m ago`;
      }
    }

    function triggerDataRefresh() {
      // Call this function whenever your RSS/API fetch completes successfully
      lastFetchTime = new Date();
      updateClock();
    }

    // Start ticking clock immediately
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
