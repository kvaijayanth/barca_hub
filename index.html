<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barça Hub</title>
  <style>
    :root {
      --bg: #0B0E14;
      --card: #161B22;
      --accent: #A50044;
      --yellow: #EDBB00;
      --text: #F0F6FC;
      --subtext: #8B949E;
      --border: #30363D;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #21262D;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(35, 134, 54, 0.15);
      color: #3FB950;
      border: 1px solid rgba(63, 185, 80, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #3FB950;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(63, 185, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
    }
    .match-card {
      background: linear-gradient(135deg, #181C24, #12151B);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .score-display {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 12px 0;
    }
    .team {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .score {
      font-size: 2rem;
      font-weight: 800;
      color: var(--yellow);
    }
    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .news-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--text);
    }
    .news-title a {
      color: inherit;
      text-decoration: none;
    }
    .news-date {
      font-size: 0.75rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; font-size: 1.4rem;">🔵🔴 Barça Hub</h1>
    <div id="clock-display" style="font-size: 1.1rem; font-weight: bold; color: var(--yellow); margin-top: 6px;">--:--:--</div>
    
    <div class="status-bar">
      <div class="badge">
        <span class="pulse-dot"></span>
        <span id="sync-status">LIVE SYNC</span>
      </div>
      <div style="font-size: 0.8rem; color: var(--subtext);" id="time-ago">Syncing...</div>
    </div>
  </div>

  <div class="match-card">
    <div style="font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px;">Recent Result • LaLiga</div>
    <div class="score-display">
      <div class="team">FC Barcelona</div>
      <div class="score">7 - 2</div>
      <div class="team">Racing Santander</div>
    </div>
    <div style="font-size: 0.8rem; color: var(--subtext);">Next: vs Sevilla FC • Sep 20, 00:30 AM IST</div>
  </div>

  <h3 style="margin: 16px 0 12px 0; font-size: 1.1rem;">Latest Headlines</h3>
  <div id="news-container">
    <div style="color: var(--subtext); font-size: 0.9rem;">Fetching live news...</div>
  </div>

  <script>
    let lastFetchTime = new Date();

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('clock-display').innerText = now.toLocaleString([], options);

      const elapsedSeconds = Math.floor((now - lastFetchTime) / 1000);
      const timeAgoEl = document.getElementById('time-ago');
      
      if (elapsedSeconds < 10) {
        timeAgoEl.innerText = 'Updated just now';
      } else if (elapsedSeconds < 60) {
        timeAgoEl.innerText = `Updated ${elapsedSeconds}s ago`;
      } else {
        const mins = Math.floor(elapsedSeconds / 60);
        timeAgoEl.innerText = `Updated ${mins}m ago`;
      }
    }

    async function fetchLiveNews() {
      const rssUrl = encodeURIComponent('https://www.espn.com/espn/rss/soccer/news?team=83');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        if (data.status === 'ok' && data.items.length > 0) {
          const newsContainer = document.getElementById('news-container');
          newsContainer.innerHTML = '';

          data.items.slice(0, 5).forEach(item => {
            const pubDate = new Date(item.pubDate).toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
              <div class="news-title"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></div>
              <div class="news-date">${pubDate}</div>
            `;
            newsContainer.appendChild(card);
          });

          lastFetchTime = new Date();
        }
      } catch (err) {
        console.error("News fetch error:", err);
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
    fetchLiveNews();
  </script>
</body>
</html>
